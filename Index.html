<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elétrica e Refrigeração</title>

    <link rel="stylesheet" href="Style.css">

    <!--FONTE-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!--ÍCONES-->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <ul class="nav-links">

                <div class="hover-pill"></div>

                <li>
                    <a href="#inicio">
                        <i class="fa-solid fa-house"></i>
                        <span>Inicio</span>
                    </a>
                </li>

                <li>
                    <a href="#servicos">
                        <i class="fa-solid fa-screwdriver-wrench"></i>
                        <span>Serviços</span>
                    </a>
                </li>

                <li>
                    <a href="#contato">
                        <i class="fa-solid fa-phone"></i>
                        <span>Contato</span>
                    </a>
                </li>

                <li>
                    <a href="#pesquisa">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span>Pesquisa</span>
                    </a>
                </li>

                <li>
                    <a href="#sobreNos">
                        <i class="fa-solid fa-users"></i>
                        <span>Sobre Nós</span>
                    </a>
                </li>

            </ul>

            <img class="LogoNav" src="Imagens/Icons/GELO.webp" alt="Logo da Empresa">
        </nav>
    </header>

<div class="Inicio">

    <div class="TextoInicio">
        <h1 class="Titulo">
            Climatização <br>
            moderna com <br>
            <span>qualidade e confiança</span>
        </h1>

        <p class="Subtitulo">
            Instalação • Manutenção • Higienização • Refrigeração
            <br><br><br>
            Soluções completas em climatização e refrigeração
            <br>
            para sua casa ou empresa.
        </p>
    </div>

    <figure class="ImagemContainer">
        <img class="LogoImg" src="Imagens/Icons/GELO.webp" alt="Logo da Empresa">

        <figcaption class="Legenda">
            Logo da Empresa, ou imagem representativa dos serviços.
        </figcaption>
    </figure>

</div>

<div class="linha-brilho"></div>

<div class ="Qualidade">
    <div class="Time">
        <h1 class="TxtTime">
            Atendimento <br>
            <span>Rapido</span>
        <img class="TimerIcon" src="Imagens/Icons/Timer.png" alt="Icone de Velocidade">
    </div>

</div>

    <script src="Main.js"></script>

</body>
</html>
